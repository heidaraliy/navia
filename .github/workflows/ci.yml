name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          threshold="85.0"
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          echo "Total coverage: ${coverage}%"
          echo "Required coverage: ${threshold}%"
          awk -v coverage="${coverage}" -v threshold="${threshold}" 'BEGIN {
            if (coverage + 0 < threshold + 0) {
              printf("coverage %.1f%% is below required %.1f%%\n", coverage, threshold)
              exit 1
            }
          }'
