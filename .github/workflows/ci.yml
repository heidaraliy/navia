name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        # actions/setup-go v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.22.x"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          threshold="85.0"
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          echo "Total coverage: ${coverage}%"
          echo "Required coverage: ${threshold}%"
          awk -v coverage="${coverage}" -v threshold="${threshold}" 'BEGIN {
            if (coverage + 0 < threshold + 0) {
              printf("coverage %.1f%% is below required %.1f%%\n", coverage, threshold)
              exit 1
            }
          }'
